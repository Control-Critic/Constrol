# Site estático: não há build, o Netlify publica a pasta raiz.
[build]
  publish = "."
  # Sem build de verdade: só carimba o commit na versão do service worker (invalida o cache a cada deploy)
  command = "sed -i \"s/__BUILD__/${COMMIT_REF:-local}/\" sw.js js/app.js"

# Funções no servidor (busca de jogos no IGDB)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Libera microfone, câmera e compartilhamento de tela para as calls
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self)"
    # HTTPS obrigatório por 1 ano (sem preload: o domínio é um subdomínio do netlify.app)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Abre pop-ups (Spotify, Discord, mini player) sem dar a eles acesso a esta janela
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    # CSP em modo SÓ RELATÓRIO: nada é bloqueado, as violações aparecem no console do navegador.
    # Ativar o modo bloqueante (trocar o nome para Content-Security-Policy) exige aprovação e testes.
    # Origens: Supabase (API, Realtime, arquivos), jsDelivr (supabase-js), Spotify, YouTube, Discord, Twitch,
    # Google Fonts; imagens vêm de vários sites (capas IGDB/Steam, notícias), por isso img-src https:.
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://open.spotify.com 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; frame-src https://open.spotify.com https://www.youtube-nocookie.com https://www.youtube.com https://discord.com https://player.twitch.tv; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"

# Verificação do app Android (TWA): o arquivo precisa ser JSON e acessível sem redirecionamento
[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

# Arquivos internos que não precisam ficar públicos
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/lib/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/turn-caseiro/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/node_modules/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/turn-proprio/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/ponte-discord/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package*"
  to = "/404.html"
  status = 404
  force = true

# Links curtos e amigáveis (para compartilhar): levam às páginas atuais, que continuam funcionando
[[redirects]]
  from = "/jogo/:slug"
  to = "/jogo.html?slug=:slug"
  status = 301
[[redirects]]
  from = "/u/:nome"
  to = "/perfil.html?u=:nome"
  status = 301
[[redirects]]
  from = "/c/:id"
  to = "/comunidade.html?id=:id"
  status = 301

# Prévia de links para robôs (WhatsApp, Discord...) e SEO
[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

# CDN de imagens do Netlify: capas de jogos e imagens enviadas passam por /.netlify/images
# (redimensionadas, em WebP e servidas pelo mesmo domínio do site)
[images]
  remote_images = ["https://images\\.igdb\\.com/.*", "https://i\\.ytimg\\.com/.*", "https://[a-z0-9.-]*steamstatic\\.com/.*", "https://[a-z0-9-]+\\.supabase\\.co/storage/.*"]
