# Atualizações automáticas de segurança (abre PRs; nada é mesclado sozinho)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    # Dependências principais só com teste manual de compatibilidade
    ignore:
      - dependency-name: sharp
        update-types: ['version-update:semver-major']
      - dependency-name: '@resvg/resvg-js'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /ponte-discord
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    # opusscript precisa ficar na versão que o prism-media aceita (^0.0.8): a 0.1.x quebra a instalação do robô
    ignore:
      - dependency-name: opusscript
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
