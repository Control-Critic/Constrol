name: Sincronizar notícias e promoções

on:
  schedule:
    - cron: '17 */6 * * *'   # a cada 6 horas
  workflow_dispatch: {}       # botão "Run workflow" no GitHub

permissions:
  contents: read   # menor privilégio: os robôs só leem o código

concurrency: sync   # nunca roda duas vezes ao mesmo tempo

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/sync.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
