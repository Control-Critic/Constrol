name: Instagram

on:
  schedule:
    - cron: '20 12 * * *'      # todo dia às 09h20 (Brasília): promoção do dia (ou enquete)
    - cron: '50 15 * * *'      # todo dia às 12h50 (Brasília): meme da comunidade ou enquete
    - cron: '50 21 * * *'      # todo dia às 18h50 (Brasília): resumo do dia, notícia ou promoção
  workflow_dispatch:
    inputs:
      modo:
        description: 'manha = promoção do dia | diario = resumo do dia | entretenimento = meme ou enquete | urgente = publica agora as notícias marcadas como urgentes'
        type: choice
        options: [manha, diario, entretenimento, urgente]
        default: diario
      noticia:
        description: 'ID da notícia (opcional, só no modo urgente)'
        default: ''
      teste:
        description: 'Só gerar as artes (sem publicar): baixe em "Artifacts" no fim da execução'
        type: boolean
        default: false

concurrency: instagram   # nunca publica duas coisas ao mesmo tempo

permissions:
  contents: read   # menor privilégio: os robôs só leem o código

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: ffmpeg (para os Reels com música)
        run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: node scripts/instagram/publicar.mjs "${{ inputs.modo || (github.event.schedule == '20 12 * * *' && 'manha') || (github.event.schedule == '50 15 * * *' && 'entretenimento') || 'diario' }}" "${{ inputs.noticia }}"
        env:
          TESTE: ${{ inputs.teste && '1' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - if: ${{ inputs.teste }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artes-instagram
          path: saida-instagram/
