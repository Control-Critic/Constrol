name: Instagram

on:
  schedule:
    - cron: '20 12 * * *'      # todo dia às 09h20 (Brasília): útil para salvar (jogo bom por menos de R$ X, antes de comprar, promoção)
    - cron: '50 15 * * *'      # todo dia às 12h50 (Brasília): opinião (meme, este ou aquele, zerou ou largou...)
    - cron: '50 21 * * *'      # todo dia às 18h50 (Brasília): notícias em carrossel, opinião da comunidade (o Reels do dia sai aqui)
    # Reservas (40 min depois): o GitHub às vezes pula agendamentos. Só publicam se o horário ainda não saiu hoje.
    - cron: '0 13 * * *'
    - cron: '30 16 * * *'
    - cron: '30 22 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'manha = 09h20 | entretenimento = 12h50 | diario = 18h50 | urgente = notícias marcadas | amostra = gera TODOS os formatos (só com "Só gerar as artes")'
        type: choice
        options: [manha, diario, entretenimento, urgente, amostra]
        default: diario
      noticia:
        description: 'ID da notícia (opcional, só no modo urgente)'
        default: ''
      formato:
        description: 'Forçar um formato (vazio = rotação automática)'
        type: choice
        options: ['', precos, promo, antes-de-comprar, meme, versus, versus-resultado, critica-comunidade, superestimado, zerou-largou, top-genero, opiniao, noticias]
        default: ''
      so_se_faltar:
        description: 'Só publicar se o post deste horário ainda não saiu hoje (usado pelo relógio da Netlify)'
        type: boolean
        default: false
      teste:
        description: 'Só gerar as artes (sem publicar): baixe em "Artifacts" no fim da execução'
        type: boolean
        default: false

concurrency: instagram   # nunca publica duas coisas ao mesmo tempo

permissions:
  contents: read   # menor privilégio: os robôs só leem o código

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Registra início
        run: node scripts/registrar-robo.mjs instagram inicio
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - run: npm ci --omit=dev
      # ffmpeg monta o Reels (a trilha é composta pelo robô). Com limite de tempo: se o apt travar,
      # o robô segue e publica em carrossel em vez de ficar parado.
      - name: ffmpeg (para os Reels)
        timeout-minutes: 4
        continue-on-error: true
        run: which ffmpeg || (sudo timeout 180 apt-get update -qq && sudo timeout 180 apt-get install -y -qq --no-install-recommends ffmpeg)
      - run: node scripts/instagram/publicar.mjs "${{ inputs.modo || ((github.event.schedule == '20 12 * * *' || github.event.schedule == '0 13 * * *') && 'manha') || ((github.event.schedule == '50 15 * * *' || github.event.schedule == '30 16 * * *') && 'entretenimento') || 'diario' }}" "${{ inputs.noticia }}"
        env:
          TESTE: ${{ inputs.teste && '1' || '' }}
          FORMATO: ${{ inputs.formato }}
          SO_SE_FALTAR: ${{ (github.event_name == 'schedule' || inputs.so_se_faltar) && '1' || '' }}
          RESERVA: ${{ (github.event.schedule == '0 13 * * *' || github.event.schedule == '30 16 * * *' || github.event.schedule == '30 22 * * *') && '1' || '' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
      - if: ${{ inputs.teste }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: artes-instagram
          path: saida-instagram/
      - name: Registra fim
        if: always()
        run: node scripts/registrar-robo.mjs instagram fim ${{ job.status }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
