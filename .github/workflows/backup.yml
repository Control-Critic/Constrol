name: Backup do banco

on:
  schedule:
    - cron: '23 5 * * 0'   # todo domingo
  workflow_dispatch: {}

permissions:
  contents: read   # menor privilégio: os robôs só leem o código

concurrency: backup   # nunca roda duas vezes ao mesmo tempo

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/backup.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-control-critic
          path: backup-*/
          retention-days: 90
