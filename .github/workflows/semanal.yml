name: Robô semanal (Steam, desafio e limpeza)

on:
  schedule:
    - cron: '7 11 * * 1'   # toda segunda às 08h07 (Brasília)
  workflow_dispatch:
    inputs:
      parte:
        description: 'O que rodar'
        type: choice
        options: [tudo, steam, desafio, limpeza]
        default: tudo

permissions:
  contents: read   # menor privilégio: os robôs só leem o código

concurrency: semanal   # nunca roda duas vezes ao mesmo tempo

jobs:
  semanal:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/semanal.mjs ${{ inputs.parte != 'tudo' && inputs.parte || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
