name: Verificações

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read   # menor privilégio: os robôs só leem o código

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Sintaxe do JavaScript
        run: for f in js/*.js scripts/*.mjs scripts/instagram/*.mjs lib/*.mjs netlify/functions/*.mjs ponte-discord/ponte.mjs sw.js; do node --check "$f" || exit 1; done
      - name: Testes das funções
        run: node --test tests/*.test.mjs
      - name: Validação do HTML
        run: npx --yes html-validate@8.24.1 "*.html"
      - name: Links e imagens locais
        run: node scripts/checar-links.mjs

  acessibilidade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: axe-core (WCAG 2.2 A/AA, problemas graves) nas páginas públicas
        run: node scripts/a11y.mjs

  seguranca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Procura segredos no código e no histórico (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --log-opts="${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '-1' }}"
      - name: Tamanho dos arquivos do site (nenhum arquivo público acima de 1,5 MB)
        run: node scripts/tamanho-assets.mjs
      - name: Dependências com vulnerabilidade alta
        run: npm audit --omit=dev --audit-level=high

  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: teste
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Simula o Supabase
        run: psql -v ON_ERROR_STOP=1 -q -f tests/supabase-stub.sql
      - name: schema.sql roda do zero
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: schema.sql roda de novo sem erro (atualização de projeto existente)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: seed.sql
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql && psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      - name: migrações rodam sobre o schema (idempotentes, em ordem)
        run: for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: testes de RLS, Storage e privilégios (visitante, A x B, moderador, admin, banido)
        run: psql -v ON_ERROR_STOP=1 -q -f tests/rls.sql
