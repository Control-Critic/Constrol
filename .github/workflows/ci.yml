name: Verificações

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read   # menor privilégio: os robôs só leem o código

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - name: Sintaxe do JavaScript
        run: for f in js/*.js scripts/*.mjs scripts/instagram/*.mjs lib/*.mjs netlify/functions/*.mjs ponte-discord/ponte.mjs sw.js; do node --check "$f" || exit 1; done
      - name: Testes das funções
        run: node --test tests/*.test.mjs
      - name: Validação do HTML
        run: npx --yes html-validate@8.24.1 "*.html"
      - name: Links e imagens locais
        run: node scripts/checar-links.mjs

  banco:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: teste
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Simula o Supabase
        run: psql -v ON_ERROR_STOP=1 -q -f tests/supabase-stub.sql
      - name: schema.sql roda do zero
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: schema.sql roda de novo sem erro (atualização de projeto existente)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/schema.sql
      - name: seed.sql
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql && psql -v ON_ERROR_STOP=1 -q -f supabase/seed.sql
      - name: migrações rodam sobre o schema (idempotentes, em ordem)
        run: for f in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -q -f "$f"; psql -v ON_ERROR_STOP=1 -q -f "$f"; done
      - name: testes de RLS, Storage e privilégios (visitante, A x B, moderador, admin, banido)
        run: psql -v ON_ERROR_STOP=1 -q -f tests/rls.sql
