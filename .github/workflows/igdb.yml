name: Importar jogos (IGDB)

on:
  schedule:
    - cron: '41 4 * * *'      # todo dia: amplia o catálogo (+2000 populares) e traz lançamentos
  workflow_dispatch:
    inputs:
      modo:
        description: 'continuo = próximos da lista + lançamentos (o mesmo do automático) | populares = do início | recentes = só lançamentos | recategorizar = refaz as categorias'
        type: choice
        options: [continuo, populares, recentes, recategorizar]
        default: continuo
      quantidade:
        description: 'Quantos jogos da lista de populares ler nesta execução (máx. 20000)'
        default: '2000'

permissions:
  contents: read   # menor privilégio: os robôs só leem o código

concurrency: igdb   # nunca roda duas vezes ao mesmo tempo

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/igdb.mjs "${{ inputs.modo || 'continuo' }}" "${{ inputs.quantidade || '2000' }}"
        env:
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
